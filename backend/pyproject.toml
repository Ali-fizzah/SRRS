[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "revrec-backend"
version = "0.1.0"
description = "Revenue recognition sub-ledger API, engine and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.0.55",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "pyyaml==6.0.3",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "hypothesis==6.170.14",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "types-pyyaml==6.0.12.20261030",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the library.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

# CLAUDE.md: mypy --strict on engine/
[[tool.mypy.overrides]]
module = "app.engine.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
